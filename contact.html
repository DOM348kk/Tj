<html lang="en">
<head>

<style>
    
        /* COLOURS: change these values to change the website theme. */
        :root {
            --dark-blue: #123D6A;
            --blue: #246BCE;
            --light-blue: #F0F6FF;
            --white: #FFFFFF;
            --text: #243247;
            --muted: #5B6878;
            --border: #D7E3F3;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--white);
        }

        .container {
            width: min(1080px, 92%);
            margin: 0 auto;
        }

        /* HEADER */
        .site-header {
            padding: 20px 0;
            color: var(--white);
            background: var(--dark-blue);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--white);
            color: var(--dark-blue);
            font-weight: bold;
        }

        .school-name {
            margin: 0;
            font-size: clamp(1.35rem, 3vw, 2rem);
            line-height: 1.2;
        }

        .school-motto {
            margin: 5px 0 0;
            color: #DCEAFF;
        }

        /* NAVIGATION */
        .navigation {
            background: var(--blue);
        }

        .navigation-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            padding: 8px 0;
        }

        .navigation a {
            padding: 9px 13px;
            border-radius: 5px;
            color: var(--white);
            font-weight: bold;
            text-decoration: none;
        }

        .navigation a:hover,
        .navigation a:focus {
            background: var(--dark-blue);
        }

        /* WELCOME AREA */
        .hero {
            padding: 48px 0;
            background: linear-gradient(135deg, var(--light-blue), #FFFFFF);
            text-align: center;
        }

        .hero h2 {
            margin: 0 auto 12px;
            color: var(--dark-blue);
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            line-height: 1.2;
        }

        .hero-intro {
            max-width: 680px;
            margin: 0 auto 22px;
            color: var(--muted);
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            border: 2px solid var(--blue);
            border-radius: 6px;
            background: var(--blue);
            color: var(--white);
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover,
        .button:focus {
            border-color: var(--dark-blue);
            background: var(--dark-blue);
        }

        .button-outline {
            background: transparent;
            color: var(--blue);
        }

        .button-outline:hover,
        .button-outline:focus {
            color: var(--white);
        }

        /* SMALL, BORDERED SLIDESHOW */
        .slideshow {
            width: min(620px, 100%);
            margin: 30px auto 0;
            overflow: hidden;
            border: 3px solid var(--blue);
            border-radius: 12px;
            background: var(--white);
            box-shadow: 0 6px 18px rgba(18, 61, 106, 0.12);
            text-align: left;
        }

        .slide-image {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: var(--light-blue);
        }

        .slide-caption {
            padding: 14px 16px 8px;
        }

        .slide-caption h3 {
            margin: 0 0 4px;
            color: var(--dark-blue);
            font-size: 1.15rem;
        }

        .slide-caption p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .slideshow-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px 15px;
        }

        .slide-count {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .slide-button {
            padding: 7px 12px;
            border: 1px solid var(--blue);
            border-radius: 5px;
            background: var(--white);
            color: var(--blue);
            font: inherit;
            cursor: pointer;
        }

        .slide-button:hover,
        .slide-button:focus {
            background: var(--blue);
            color: var(--white);
        }

        /* GENERAL SECTIONS */
        .section {
            padding: 52px 0;
            scroll-margin-top: 18px;
        }

        .section-light {
            background: var(--light-blue);
        }

        .section-heading {
            margin: 0 0 10px;
            color: var(--dark-blue);
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            text-align: center;
        }

        .section-intro {
            max-width: 700px;
            margin: 0 auto 28px;
            color: var(--muted);
            text-align: center;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .about-grid h3 {
            margin-top: 0;
            color: var(--dark-blue);
        }

        .about-panel {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--light-blue);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--white);
        }

        .card-icon {
            font-size: 1.8rem;
        }

        .card h3 {
            margin: 8px 0;
            color: var(--dark-blue);
        }

        .card p {
            margin-bottom: 0;
            color: var(--muted);
        }

        /* CONTACT DETAILS AND FORM */
       
        .contact-panel,
        .contact-form {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--white);
        }

        .contact-panel h3,
        .contact-form h3 {
            margin-top: 0;
            color: var(--dark-blue);
        }

        .form-field {
            margin-bottom: 14px;
        }

        .form-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #AEBFD5;
            border-radius: 5px;
            color: var(--text);
            font: inherit;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: 3px solid #C6DDFE;
            border-color: var(--blue);
        }

        .form-message {
            color: var(--dark-blue);
            font-weight: bold;
        }

        /* FOOTER */
        .site-footer {
            padding: 22px 0;
            background: var(--dark-blue);
            color: var(--white);
            text-align: center;
        }

        .site-footer p {
            margin: 4px 0;
        }

        /* PHONE AND SMALL SCREEN LAYOUT */
        @media (max-width: 700px) {
            .hero {
                padding: 38px 0;
            }

            .slide-image {
                height: 200px;
            }

            .about-grid,
            .cards,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 38px 0;
            }

            .navigation a {
                padding: 8px 9px;
                font-size: 0.92rem;
            }
        }

        /* Respect the visitor's reduced-motion preference. */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
